<script>
$(document).ready(function(){
$(".led").maskMoney({allowZero:true});

  //var $usernameField = $('.led'),
       // defaultValue = $usernameField.data('default-value');
    $('.led').on('focus', function (event) {
		var $this = $(this);
		defaultValue = $this.attr('data-default-value');
        //console.log($this.val());
        if ($this.val() == defaultValue) $this.val('');
    });
    $('.led').on('focusout', function (event) {
        var $this = $(this);
		defaultValue = $this.attr('data-default-value');
        if ($this.val().trim() == '')
			$this.val(defaultValue);
		else
		{
			$this.attr('data-default-value', $this.val());
			$this.attr('value', $this.val());
		}
    });

function checkserial()
{
if(serialstart=="yes") {
 $.get("./checkserial", function(data, status){

	 $.each( myArr, function( index, value )  { console.log(index+" "+value);

});
  });
}
}
